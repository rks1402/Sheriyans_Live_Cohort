<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-xl space-y-6">
      
      <!-- Header -->
      <h1 class="text-3xl font-bold text-center">GitHub User Search</h1>
  
      <!-- Search Bar -->
      <div class="flex items-center gap-2">
        <input
          type="text"
          placeholder="Enter GitHub username..."
          class="usernameinp flex-1 px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-800"
        />
        <button
          class="search px-5 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition font-medium"
        >
          Search
        </button>
      </div>
  
      <!-- User Info Card -->
      <div class="container bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 space-y-4">
        
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
