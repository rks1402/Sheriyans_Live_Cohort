<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light & Dark Theme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="theme">Dark UI</div>
    <form>
      <h1>Login to continue</h1>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" class="form-control" id="email" name="email" placeholder="Enter your Email address">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" name="password" id="password" placeholder="Enter your password">
      </div>
      <div class="form-group" id="checkbox">
        <input type="checkbox" name="remember" id="remember">
        <div>Remember me</div>
      </div>
      <input type="button" id="login-btn" value="Login">
      <div class="form-group" id="forgot-password">
        <a href="#" id="frt-pwd">Forgot Password?</a>
      </div>
      <br><br><br>
      <div class="form-group" id="signup-now">
        <p>New here? <a href="#">Sign Up now</a></p>
      </div>
    </form>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
