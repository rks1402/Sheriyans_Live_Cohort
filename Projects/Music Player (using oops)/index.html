<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mode">DARK <i class="ri-moon-fill"></i></div>

    <div class="container">
        <img src="" alt="">
        <div class="song-title">Song Title</div>
        <div class="song-artist">Song Artist</div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0">
            <span id="duration">0:00</span>
        </div>
        <div class="media-controls">
            <i class="ri-rewind-line" id="previous"></i>
            <div class="play-pause">
                <i class="ri-play-line" id="play"></i>
                <i class="ri-pause-line" id="pause" hidden></i>
            </div>
            <i class="ri-speed-line" id="next"></i>
        </div>
        <div class="volume-container">
            <i class="ri-volume-down-line"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value=".6">
            <i class="ri-volume-up-line"></i>
        </div>
        <audio id="audio-player" src="" hidden></audio>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
