<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>My To-Do List</h1>
      <button id="addTaskBtn">＋ Add Task</button>
      <dialog>
        <form method="dialog">
          <input type="text" name="addTaskTitle" id="addTaskTitle" placeholder="Task title here..." required/>
          <textarea rows="4" name="addTaskDescription" id="addTaskDescription" placeholder="Task description here..." required></textarea>
          <button id="dialogAddBtn">Add</button>
        </form>
      </dialog>
    </div>
    <div class="task-container">
      <div class="task-section" id="section1">
        <h2>To Do</h2>
      </div>
      <div class="task-section" id="section2">
        <h2>In Progress</h2>
      </div>
      <div class="task-section" id="section3">
        <h2>Completed</h2>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
